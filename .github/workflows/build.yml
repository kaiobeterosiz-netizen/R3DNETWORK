name: Build Mod Menu

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Instalar JDK 17 (necessário para o sdkmanager)
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 2. Instalar Android SDK e NDK manualmente
    - name: Install Android SDK & NDK
      env:
        SKIP_JDK_VERSION_CHECK: true
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
        
        # Baixar command-line tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        
        # Aceitar licenças e instalar pacotes
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
        
        # Exportar variáveis para as próximas etapas
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
        echo "PATH=$PATH" >> $GITHUB_ENV

    # 3. Voltar para o JDK 11 (exigido pelo Gradle 6.9)
    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'

    # 4. Instalar Gradle 6.9 manualmente
    - name: Install Gradle 6.9
      run: |
        wget -q https://services.gradle.org/distributions/gradle-6.9-bin.zip
        unzip -q gradle-6.9-bin.zip -d $HOME/gradle
        echo "$HOME/gradle/gradle-6.9/bin" >> $GITHUB_PATH

    # 5. Compilar o APK (classes.dex)
    - name: Build APK
      run: |
        gradle wrapper --gradle-version 6.9
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Extract Dex
      run: |
        mkdir -p output
        cp app/build/outputs/apk/debug/app-debug.apk output/
        cd output
        unzip app-debug.apk classes.dex
        mv classes.dex classes2.dex

    # 6. Compilar a biblioteca nativa (.so)
    - name: Build Native Lib (.so)
      run: |
        cd app/src/main/jni
        $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=arm64-v8a

    - name: Copy SO
      run: |
        cp app/src/main/jni/libs/arm64-v8a/libmodmenu.so output/ || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ModMenuFiles
        path: output/
