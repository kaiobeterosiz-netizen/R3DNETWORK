name: Build Mod Menu

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '6.9'
        cache-disabled: true

    - name: Build APK (classes.dex)
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Extract Dex
      run: |
        mkdir -p output
        cp app/build/outputs/apk/debug/app-debug.apk output/
        cd output
        unzip app-debug.apk classes.dex
        mv classes.dex classes2.dex

    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v4
      with:
        ndk-version: '25.2.9519653'

    - name: Build Native Lib (.so)
      run: |
        cd app/src/main/jni
        $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=arm64-v8a

    - name: Copy SO
      run: |
        cp app/src/main/jni/libs/arm64-v8a/libmodmenu.so output/ || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ModMenuFiles
        path: output/
